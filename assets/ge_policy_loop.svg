<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">星衡 Alpha 观势格物行仓流程</title>
  <desc id="desc">把伟大变化转化为证据链、资产图谱、风险边界、仓位动作和复盘回写。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1322"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9b949"/>
      <stop offset="1" stop-color="#1fd18a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5f739a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1fd18a"/>
    </marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
      .muted{fill:#9fb2d2}
      .text{fill:#eaf0fb}
      .gold{fill:#e9b949}
      .green{fill:#1fd18a}
      .panel{fill:#111a30;stroke:#2a3a5c;stroke-width:1.5}
      .panel2{fill:#13243a;stroke:#314468;stroke-width:1.5}
      .small{font-size:17px}
      .tiny{font-size:14px}
      .label{font-size:22px;font-weight:800}
      .head{font-size:38px;font-weight:860}
    </style>
  </defs>

  <rect width="1180" height="620" rx="28" fill="url(#bg)"/>
  <path d="M40 112 H1140" stroke="#23304f" stroke-width="1" stroke-dasharray="3 10"/>
  <path d="M40 482 H1140" stroke="#23304f" stroke-width="1" stroke-dasharray="3 10"/>

  <text x="64" y="70" class="head text">星衡 Alpha · 观势、格物、定界、行仓</text>
  <text x="64" y="100" class="small muted">不是替代判断，而是把“伟大的变化”变成可识别、可验证、可交易、可风控的流程</text>

  <text x="70" y="162" class="label gold">大脑 · 观势台</text>
  <text x="70" y="188" class="tiny muted">维护长期命题、证据链、反例和失效条件</text>

  <rect x="70" y="220" width="185" height="112" rx="16" class="panel"/>
  <text x="162" y="264" text-anchor="middle" class="label text">观势</text>
  <text x="162" y="294" text-anchor="middle" class="tiny muted">时代变量</text>
  <text x="162" y="318" text-anchor="middle" class="tiny muted">主要矛盾</text>

  <rect x="315" y="220" width="185" height="112" rx="16" class="panel"/>
  <text x="408" y="264" text-anchor="middle" class="label text">取证</text>
  <text x="408" y="294" text-anchor="middle" class="tiny muted">来源 / 反例</text>
  <text x="408" y="318" text-anchor="middle" class="tiny muted">验证指标</text>

  <rect x="560" y="220" width="185" height="112" rx="16" class="panel2"/>
  <text x="652" y="264" text-anchor="middle" class="label text">格物</text>
  <text x="652" y="294" text-anchor="middle" class="tiny muted">产业链</text>
  <text x="652" y="318" text-anchor="middle" class="tiny muted">资产关系</text>

  <rect x="805" y="220" width="185" height="112" rx="16" class="panel"/>
  <text x="898" y="264" text-anchor="middle" class="label text">定界</text>
  <text x="898" y="294" text-anchor="middle" class="tiny muted">赔率 1:3</text>
  <text x="898" y="318" text-anchor="middle" class="tiny muted">失效条件</text>

  <line x1="255" y1="276" x2="306" y2="276" stroke="#5f739a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="500" y1="276" x2="551" y2="276" stroke="#5f739a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="745" y1="276" x2="796" y2="276" stroke="#5f739a" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="70" y="406" class="label green">小脑 · 行仓台</text>
  <text x="70" y="432" class="tiny muted">处理价格确认、仓位、CVaR、换手成本和复盘回写</text>

  <rect x="190" y="492" width="185" height="92" rx="16" class="panel2"/>
  <text x="282" y="531" text-anchor="middle" class="label text">确认</text>
  <text x="282" y="558" text-anchor="middle" class="tiny muted">价格 / 成交 / 拥挤</text>

  <rect x="445" y="492" width="185" height="92" rx="16" class="panel2"/>
  <text x="538" y="531" text-anchor="middle" class="label text">行仓</text>
  <text x="538" y="558" text-anchor="middle" class="tiny muted">入池 / 加仓 / 降险</text>

  <rect x="700" y="492" width="185" height="92" rx="16" class="panel2"/>
  <text x="792" y="531" text-anchor="middle" class="label text">回照</text>
  <text x="792" y="558" text-anchor="middle" class="tiny muted">复盘回写命题库</text>

  <line x1="375" y1="538" x2="436" y2="538" stroke="#5f739a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="630" y1="538" x2="691" y2="538" stroke="#5f739a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M898 332 C898 415 282 405 282 482" fill="none" stroke="#1fd18a" stroke-width="4" marker-end="url(#arrowGreen)" filter="url(#glow)"/>
  <path d="M792 492 C792 438 162 438 162 340" fill="none" stroke="#e9b949" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)" opacity=".85"/>

  <rect x="1010" y="220" width="100" height="364" rx="18" fill="#10182b" stroke="#314468" stroke-width="1.5"/>
  <text x="1060" y="262" text-anchor="middle" class="label green">知止</text>
  <text x="1060" y="304" text-anchor="middle" class="tiny muted">回撤</text>
  <text x="1060" y="330" text-anchor="middle" class="tiny muted">拥挤</text>
  <text x="1060" y="356" text-anchor="middle" class="tiny muted">流动性</text>
  <text x="1060" y="382" text-anchor="middle" class="tiny muted">换手</text>
  <text x="1060" y="430" text-anchor="middle" class="tiny gold">先降险</text>
  <text x="1060" y="456" text-anchor="middle" class="tiny gold">再复核</text>
  <path d="M990 276 L1000 276" stroke="#5f739a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M885 538 L1000 538" stroke="#5f739a" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
